name: Build desktop app

# When does this run?
#   1. Manually, from the Actions tab ("Run workflow" button).
#   2. Automatically when you push a version tag like v3.1 — that build also
#      publishes a GitHub Release with the Windows and macOS binaries attached.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Needed so the release job can create a Release and upload assets.
permissions:
  contents: write

jobs:
  build:
    # The matrix fans this single job out into two parallel jobs, one on a
    # real Windows machine and one on a real macOS machine. PyInstaller
    # cannot cross-compile, so each OS must build its own binary.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: BJI_Logger-windows
          - os: macos-latest
            artifact_name: BJI_Logger-macos

    runs-on: ${{ matrix.os }}

    steps:
      # 1. Get the source code onto the runner.
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Install the Python interpreter used to build the app.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Install the app's dependencies plus PyInstaller itself.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 4. Freeze the app into a native bundle using the checked-in spec.
      #    The spec detects the OS and produces a .exe folder on Windows and
      #    a .app bundle on macOS.
      - name: Build with PyInstaller
        run: pyinstaller index.spec --noconfirm

      # 5. Zip the build output so it uploads as a single file, and normalise
      #    the folder name across OSes.
      - name: Package build output (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/BJI_Logger/* -DestinationPath ${{ matrix.artifact_name }}.zip
        shell: pwsh

      - name: Package build output (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          # Prefer the .app bundle if present, otherwise the plain folder.
          if [ -d "BJI_Logger.app" ]; then
            zip -r "../${{ matrix.artifact_name }}.zip" "BJI_Logger.app"
          else
            zip -r "../${{ matrix.artifact_name }}.zip" "BJI_Logger"
          fi

      # 6. Attach the zip to this workflow run so you can download it from the
      #    Actions tab (kept for 30 days). This happens on every build.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          retention-days: 30

      # 7. If this build was triggered by a version tag, also attach the zip to
      #    a public GitHub Release so end users have a permanent download link.
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}.zip
